<!DOCTYPE html>

<head>

    <title>OnMyOwnTrip Toledo - App Definitiva</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS para Mapas Reales -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

    <style>
        .leaflet-layer,
        .leaflet-control-zoom-in,
        .leaflet-control-zoom-out,
        .leaflet-control-attribution {
            filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3);
        }
        @keyframes pulse-subtle {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.12); }
        }
        .pin-pulse {
            animation: pulse-subtle 2s infinite ease-in-out;
        }

<body id="app-body" class="h-full bg-slate-900 text-slate-100 font-sans overflow-hidden flex justify-center items-center transition-colors duration-500">

        <header id="header-bg" class="absolute top-0 left-0 right-0 z-[1000] p-4 bg-gradient-to-b from-slate-900/95 to-slate-900/40 flex flex-col gap-2.5 backdrop-blur-sm transition-colors duration-300">
            <div class="flex justify-between items-center">
                <div>

                        <span id="mode-badge" class="text-xs bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-full">Adultos</span>
                    </h1>
                    <p id="app-subtitle" class="text-xs text-slate-300">Toledo: Turismo Autoguiado Inteligente</p>
                </div>
                <!-- Selector de Modo Adulto / Niño -->
                <div class="flex bg-slate-900/90 border border-slate-700 rounded-full p-1 gap-1 shadow-inner">
                    <button onclick="setMode('adult')" id="mode-adult-btn" class="px-3 py-1 rounded-full text-xs font-bold bg-amber-500 text-slate-950 transition-all shadow">
                        🧑 Adultos
                    </button>
                    <button onclick="setMode('kid')" id="mode-kid-btn" class="px-3 py-1 rounded-full text-xs font-semibold text-slate-300 hover:text-white transition-all">
                        🎈 Niños
                    </button>
                </div>
            </div>
        </header>

        <!-- Filtros Superiores Horizontales (Píldoras) -->
        <div class="absolute top-24 left-0 right-0 z-[1000] px-4 py-2 flex gap-2 overflow-x-auto no-scrollbar scroll-smooth pointer-events-auto">
            <button onclick="filterPOIs('all')" id="btn-all" class="filter-btn px-4 py-1.5 rounded-full text-xs font-medium bg-amber-500 text-slate-950 shadow-md whitespace-nowrap transition-all">
                Todos
            </button>
            <button onclick="filterPOIs('history')" id="btn-history" class="filter-btn px-4 py-1.5 rounded-full text-xs font-medium bg-slate-800/90 text-slate-200 border border-slate-600 backdrop-blur whitespace-nowrap transition-all">
                🏛️ Historia
            </button>
            <button onclick="filterPOIs('food')" id="btn-food" class="filter-btn px-4 py-1.5 rounded-full text-xs font-medium bg-slate-800/90 text-slate-200 border border-slate-600 backdrop-blur whitespace-nowrap transition-all">
                🍷 Gastronomía
            </button>
            <button onclick="filterPOIs('hidden')" id="btn-hidden" class="filter-btn px-4 py-1.5 rounded-full text-xs font-medium bg-slate-800/90 text-slate-200 border border-slate-600 backdrop-blur whitespace-nowrap transition-all">
                🗝️ Rincones Ocultos
            </button>
        </div>

        <!-- Contenedor del Mapa Real Leaflet -->
        <div id="map" class="w-full h-full z-10 bg-slate-950"></div>

        <!-- Tarjeta Inferior Deslizante (BottomSheet con Chat e Intro Auto-Play) -->
        <div id="bottom-sheet" class="absolute bottom-0 left-0 right-0 bg-slate-800/98 backdrop-blur-md border-t border-slate-700 rounded-t-3xl p-4 z-[2000] transform translate-y-full transition-transform duration-300 ease-out shadow-2xl flex flex-col max-h-[82vh]">

            <!-- Cabecera Esencial del POI -->
            <div class="flex items-start gap-3 mb-2.5 flex-shrink-0">
                <img id="sheet-image" src="" alt="POI Image" class="w-16 h-16 rounded-xl object-cover border border-slate-700 flex-shrink-0">
                <div class="flex-1 min-w-0">
                    <span id="sheet-category" class="inline-block text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 mb-0.5">Categoría</span>
                    <h3 id="sheet-title" class="font-bold text-sm text-white truncate">Título del Lugar</h3>
                    <p id="sheet-desc" class="text-xs text-slate-300 line-clamp-2 mt-0.5">Información esencial...</p>
                </div>
                <button onclick="closeBottomSheet()" class="text-slate-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>

            <div id="ai-chat-container" class="flex-1 bg-slate-900/90 border border-slate-700/60 rounded-2xl p-3 overflow-y-auto space-y-2.5 mb-2 min-h-[130px] max-h-[200px]">

            </div>

            <!-- Opciones Dinámicas Generadas por IA para seguir explorando -->

                <!-- Se generan nuevas opciones tras cada interacción -->
            </div>

            <!-- Reproductor de Audio Adaptado -->
            <div class="bg-slate-900/80 border border-slate-700/60 rounded-xl p-2.5 flex flex-col gap-1.5 flex-shrink-0">

                    <span id="audio-label" class="flex items-center gap-1.5 text-amber-400 font-medium">
                        <i class="fa-solid fa-headphones"></i> Audio Guía IA (Auto-play)
                    </span>
                    <span id="audio-time">0:00 / 1:00</span>
                </div>

                <div class="w-full bg-slate-700 h-1.5 rounded-full overflow-hidden cursor-pointer" onclick="seekAudio(event)">
                    <div id="audio-progress" class="bg-amber-400 h-full w-0 transition-all duration-100"></div>
                </div>

                <div class="flex items-center justify-between pt-0.5">
                    <button onclick="changeSpeed()" id="speed-btn" class="text-[10px] font-semibold px-2 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-300 hover:text-white transition">

                            <i class="fa-solid fa-rotate-left"></i>
                        </button>
                        <button onclick="togglePlay()" id="play-btn" class="w-8 h-8 rounded-full bg-amber-400 text-slate-950 flex items-center justify-center shadow-md hover:bg-amber-300 transition text-xs">
                            <i class="fa-solid fa-play ml-0.5"></i>
                        </button>
                        <button onclick="skipTime(10)" class="text-slate-400 hover:text-white transition text-xs">
                            <i class="fa-solid fa-rotate-right"></i>
                        </button>
                    </div>
                    <span class="text-[10px] text-slate-500">Voz IA</span>
                </div>
            </div>
        </div>

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([39.8567, -4.0244], 15);

            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                maxZoom: 19,
                subdomains: 'abcd',
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);

            markersLayer.addTo(map);
            renderPins('all');
        }

        function setMode(mode) {
            currentMode = mode;
            stopAudioEngine();
            closeBottomSheet();

            const adultBtn = document.getElementById('mode-adult-btn');
            const kidBtn = document.getElementById('mode-kid-btn');
            const badge = document.getElementById('mode-badge');
            const playBtn = document.getElementById('play-btn');
            const appTitle = document.getElementById('app-title');
            const appSubtitle = document.getElementById('app-subtitle');
            const headerIcon = document.getElementById('header-icon');

            if (mode === 'adult') {
                adultBtn.className = "px-3 py-1 rounded-full text-xs font-bold bg-amber-500 text-slate-950 transition-all shadow";
                kidBtn.className = "px-3 py-1 rounded-full text-xs font-semibold text-slate-300 hover:text-white transition-all";
                badge.className = "text-xs bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-full";
                badge.innerText = "Adultos";
                playBtn.className = "w-8 h-8 rounded-full bg-amber-400 text-slate-950 flex items-center justify-center shadow-md hover:bg-amber-300 transition text-xs";
                appTitle.innerText = "OnMyOwnTrip";
                appSubtitle.innerText = "Toledo: Turismo Autoguiado";
                headerIcon.className = "fa-solid fa-compass text-amber-400";
            } else {
                adultBtn.className = "px-3 py-1 rounded-full text-xs font-semibold text-slate-300 hover:text-white transition-all";
                kidBtn.className = "px-3 py-1 rounded-full text-xs font-bold bg-indigo-500 text-white transition-all shadow";
                badge.className = "text-xs bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded-full";
                badge.innerText = "Modo Niños 🎈";
                playBtn.className = "w-8 h-8 rounded-full bg-indigo-500 text-white flex items-center justify-center shadow-md hover:bg-indigo-400 transition text-xs";
                appTitle.innerText = "OnMyOwnTrip Kids";
                appSubtitle.innerText = "¡Aventuras mágicas a tu ritmo!";
                headerIcon.className = "fa-solid fa-rocket text-indigo-400";
            }

            renderPins(activeCategory);
        }

        function renderPins(filter = 'all') {
            activeCategory = filter;
            markersLayer.clearLayers();

            const filtered = filter === 'all' ? pois : pois.filter(p => p.category === filter);

            filtered.forEach(poi => {
                let iconColorBg = currentMode === 'adult' ? '#f59e0b' : '#6366f1';
                let iconSymbol = 'fa-map-pin';
                if(poi.category === 'history') iconSymbol = 'fa-landmark';
                if(poi.category === 'food') iconSymbol = 'fa-utensils';
                if(poi.category === 'hidden') iconSymbol = 'fa-key';

                const customIcon = L.divIcon({
                    className: 'custom-pin',
                    html: `<div style="background-color: ${iconColorBg};" class="w-10 h-10 rounded-full flex items-center justify-center shadow-xl border-2 border-slate-900 text-slate-950 font-bold pin-pulse">
                             <i class="fa-solid ${iconSymbol} text-xs text-white"></i>
                           </div>`,
                    iconSize: [40, 40],
                    iconAnchor: [20, 20]
                });

                const marker = L.marker([poi.lat, poi.lng], { icon: customIcon });
                marker.on('click', () => openPOI(poi));
                markersLayer.addLayer(marker);
            });
        }

        function filterPOIs(category) {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = "filter-btn px-4 py-1.5 rounded-full text-xs font-medium bg-slate-800/90 text-slate-200 border border-slate-600 backdrop-blur whitespace-nowrap transition-all";
            });
            
            const activeBtn = document.getElementById(`btn-${category}`);
            const activeColor = currentMode === 'adult' ? 'bg-amber-500 text-slate-950' : 'bg-indigo-500 text-white';
            activeBtn.className = `filter-btn px-4 py-1.5 rounded-full text-xs font-medium ${activeColor} shadow-md whitespace-nowrap transition-all`;

            renderPins(category);
            closeBottomSheet();
        }

        function openPOI(poi) {
            stopAudioEngine();
            currentPOI = poi;
            currentTimeSec = 0;

            const modeData = poi[currentMode] || poi['adult'];
            if (!modeData) return;

            document.getElementById('sheet-title').innerText = modeData.title;
            document.getElementById('sheet-category').innerText = poi.categoryName;
            document.getElementById('sheet-desc').innerText = modeData.essential;
            document.getElementById('sheet-image').src = poi.image;

            currentAiText = modeData.initialAudio || modeData.essential;

            const chatContainer = document.getElementById('ai-chat-container');
            chatContainer.innerHTML = `
                <div class="flex items-start gap-2">
                    <div class="w-6 h-6 rounded-full bg-amber-500 text-slate-950 flex items-center justify-center text-[10px] font-bold flex-shrink-0"><i class="fa-solid fa-robot"></i></div>
                    <div class="bg-slate-800 border border-slate-700/80 rounded-2xl p-2.5 text-xs text-slate-200 shadow-sm">
                        ${modeData.initialAudio || modeData.essential}
                    </div>
                </div>
            `;

            renderDynamicPrompts(modeData.initialPrompts);

            const sheet = document.getElementById('bottom-sheet');
            sheet.classList.remove('translate-y-full');

            map.flyTo([poi.lat, poi.lng], 17, { duration: 0.8 });
            startAudioEngine();
        }

        function renderDynamicPrompts(promptsList) {
            const suggestionsContainer = document.getElementById('ai-suggestions');
            suggestionsContainer.innerHTML = '';

            if (!promptsList) return;

            promptsList.forEach(item => {
                const btn = document.createElement('button');
                const btnColor = currentMode === 'adult' 
                    ? 'bg-amber-500/10 text-amber-300 border-amber-500/30 hover:bg-amber-500/20' 
                    : 'bg-indigo-500/10 text-indigo-300 border-indigo-500/30 hover:bg-indigo-500/20';
                
                btn.className = `px-3 py-1.5 rounded-xl text-xs whitespace-nowrap border transition-all ${btnColor}`;
                btn.innerText = item.label;
                btn.onclick = () => handleAiBranch(item.label, item.nextKey);
                suggestionsContainer.appendChild(btn);
            });
        }

        function handleAiBranch(question, nextKey) {
            stopAudioEngine();
            currentTimeSec = 0;

            const modeData = currentPOI[currentMode] || currentPOI['adult'];
            const chatContainer = document.getElementById('ai-chat-container');
            
            const userMsg = document.createElement('div');
            userMsg.className = "flex items-start gap-2 justify-end";
            const userBubbleColor = currentMode === 'adult' ? 'bg-amber-500 text-slate-950' : 'bg-indigo-500 text-white';
            userMsg.innerHTML = `<div class="${userBubbleColor} rounded-2xl p-2.5 text-xs shadow-sm max-w-[85%]">${question}</div>`;
            chatContainer.appendChild(userMsg);

            setTimeout(() => {
                let responseText = modeData.essential;
                let nextPrompts = modeData.initialPrompts;

                if (nextKey === 'root') {
                    responseText = "¡Volvemos al punto de partida! ¿Qué otro aspecto te apetece descubrir ahora?";
                    nextPrompts = modeData.initialPrompts;
                } else if (modeData.subBranches && modeData.subBranches[nextKey]) {
                    const branch = modeData.subBranches[nextKey];
                    responseText = branch.text;
                    nextPrompts = branch.nextPrompts;
                }

                currentAiText = responseText;

                const aiMsg = document.createElement('div');
                aiMsg.className = "flex items-start gap-2";
                aiMsg.innerHTML = `
                    <div class="w-6 h-6 rounded-full bg-amber-500 text-slate-950 flex items-center justify-center text-[10px] font-bold flex-shrink-0"><i class="fa-solid fa-robot"></i></div>
                    <div class="bg-slate-800 border border-slate-700/80 rounded-2xl p-2.5 text-xs text-slate-200 shadow-sm max-w-[85%]">
                        ${responseText}
                    </div>
                `;
                chatContainer.appendChild(aiMsg);
                chatContainer.scrollTop = chatContainer.scrollHeight;

                renderDynamicPrompts(nextPrompts);
                updateAudioUI();
                startAudioEngine();
            }, 300);

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function closeBottomSheet() {
            stopAudioEngine();
            const sheet = document.getElementById('bottom-sheet');
            sheet.classList.add('translate-y-full');
        }

        function togglePlay() {
            if(!currentPOI) return;
            if(isPlaying) stopAudioEngine();
            else startAudioEngine();
        }

        function startAudioEngine() {
            if(!currentPOI) return;
            isPlaying = true;
            document.getElementById('play-btn').innerHTML = '<i class="fa-solid fa-pause"></i>';

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(currentAiText);
                utterance.lang = 'es-ES';
                utterance.rate = currentRate;
                
                utterance.onend = () => {
                    stopAudioEngine();
                    currentTimeSec = totalDurationSec;
                    updateAudioUI();
                };

                window.speechSynthesis.speak(utterance);
            }

            progressInterval = setInterval(() => {
                currentTimeSec += currentRate;
                if(currentTimeSec >= totalDurationSec) {
                    currentTimeSec = totalDurationSec;
                    stopAudioEngine();
                }
                updateAudioUI();
            }, 1000);
        }

        function stopAudioEngine() {
            isPlaying = false;
            clearInterval(progressInterval);
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            const playBtn = document.getElementById('play-btn');
            if(playBtn) playBtn.innerHTML = '<i class="fa-solid fa-play ml-0.5"></i>';
        }

        function updateAudioUI() {
            const progressPercent = (currentTimeSec / totalDurationSec) * 100;
            document.getElementById('audio-progress').style.width = `${Math.min(progressPercent, 100)}%`;

            const currentMin = Math.floor(currentTimeSec / 60);
            const currentSec = Math.floor(currentTimeSec % 60).toString().padStart(2, '0');
            const totalMin = Math.floor(totalDurationSec / 60);
            const totalSec = Math.floor(totalDurationSec % 60).toString().padStart(2, '0');

            document.getElementById('audio-time').innerText = `${currentMin}:${currentSec} / ${totalMin}:${totalSec}`;
        }

        function seekAudio(event) {
            if(!currentPOI) return;
            const bar = event.currentTarget;
            const rect = bar.getBoundingClientRect();
            const percentage = (event.clientX - rect.left) / rect.width;
            currentTimeSec = percentage * totalDurationSec;
            updateAudioUI();
        }

        function skipTime(seconds) {
            if(!currentPOI) return;
            currentTimeSec = Math.max(0, Math.min(totalDurationSec, currentTimeSec + seconds));
            updateAudioUI();
        }

        const speeds = [1.0, 1.25, 1.5, 2.0];
        let speedIdx = 0;
        function changeSpeed() {
            speedIdx = (speedIdx + 1) % speeds.length;
            currentRate = speeds[speedIdx];
            document.getElementById('speed-btn').innerText = `${currentRate}x`;
            if(isPlaying) startAudioEngine();
        }

        window.onload = () => {
            initMap();
        };
    </script>
</body>
</html>
